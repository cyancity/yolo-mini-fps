<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>时段预览</title>
<style>
  #tod { position: fixed; left: 12px; top: 12px; z-index: 1; display: flex; gap: 6px; font: 13px/1 system-ui, sans-serif; }
